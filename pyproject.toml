[project]
name = "snafu"
version = "0.1.0"
description = "snafu: Symbol Name Ambiguity Fixer-Upper."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "any-llm-sdk[anthropic,gemini,openai]>=1.25.0",
    "tree-sitter-language-pack>=1.14.3",
]

[project.urls]
Homepage = "https://github.com/sebastiancarlos/snafu"
Repository = "https://github.com/sebastiancarlos/snafu"

[project.optional-dependencies]
dev = ["ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
snafu = "snafu:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snafu"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "RUF100"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
exclude = ["**/__pycache__", ".ruff_cache", ".venv"]
